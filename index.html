<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Work English</title>
<meta name="description" content="Natural professional English for frontend work." />
<style>
:root{
  --bg:oklch(0.985 0.008 262);--surface:#fff;--surface-2:oklch(0.965 0.013 262);
  --ink:oklch(0.29 0.03 265);--ink-2:oklch(0.52 0.025 265);--ink-3:oklch(0.62 0.02 265);
  --line:oklch(0.915 0.014 265);--accent:oklch(0.55 0.19 265);--accent-soft:oklch(0.945 0.035 265);
  --accent-ink:oklch(0.45 0.17 265);--on-accent:#fff;--hero-bg:oklch(0.55 0.19 265);--hero-ink:#fff;
  --hero-sub:oklch(0.9 0.05 265);--mint:oklch(0.935 0.055 165);--mint-ink:oklch(0.42 0.11 165);
  --mint-line:oklch(0.84 0.08 165);--rose:oklch(0.95 0.035 22);--rose-ink:oklch(0.5 0.14 22);
  --shadow:0 2px 3px oklch(0.5 0.06 265/.04),0 12px 26px oklch(0.5 0.06 265/.07);
  --shadow-lift:0 4px 6px oklch(0.5 0.06 265/.06),0 18px 38px oklch(0.5 0.08 265/.13)
}
html[data-theme="dark"]{
  --bg:oklch(0.205 0.022 265);--surface:oklch(0.25 0.026 265);--surface-2:oklch(0.3 0.03 265);
  --ink:oklch(0.955 0.012 265);--ink-2:oklch(0.79 0.02 265);--ink-3:oklch(0.67 0.02 265);
  --line:oklch(0.36 0.03 265);--accent:oklch(0.72 0.15 265);--accent-soft:oklch(0.33 0.06 265);
  --accent-ink:oklch(0.85 0.12 265);--on-accent:oklch(0.2 0.03 265);--hero-bg:oklch(0.34 0.09 265);
  --hero-ink:oklch(0.97 0.015 265);--hero-sub:oklch(0.84 0.04 265);--mint:oklch(0.34 0.065 165);
  --mint-ink:oklch(0.88 0.12 165);--mint-line:oklch(0.5 0.09 165);--rose:oklch(0.33 0.07 22);
  --rose-ink:oklch(0.87 0.12 22);--shadow:0 2px 3px rgb(0 0 0/.18),0 12px 26px rgb(0 0 0/.26);
  --shadow-lift:0 4px 8px rgb(0 0 0/.24),0 18px 38px rgb(0 0 0/.34)
}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
body{font-family:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}button{color:inherit}a{color:inherit}.hidden{display:none!important}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.95) rotate(-1deg)}100%{transform:scale(1)}}
.app{min-height:100vh;position:relative;overflow-x:hidden;padding-bottom:92px}
.blob{position:absolute;border-radius:50%;pointer-events:none}.blob.one{width:420px;height:420px;right:-110px;top:-150px;background:var(--accent-soft);opacity:.8}.blob.two{width:330px;height:330px;left:-170px;top:420px;background:var(--mint);opacity:.45}
header{position:sticky;top:0;z-index:20;background:color-mix(in oklab,var(--bg) 85%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.header-in{max-width:1000px;margin:auto;padding:13px 20px;display:flex;align-items:center;gap:10px}.brand{display:flex;align-items:center;gap:11px;margin-right:auto}.logo{width:36px;height:36px;border-radius:13px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:13px;font-weight:900;box-shadow:var(--shadow);transform:rotate(-4deg)}
.brand-name{font-size:19px;font-weight:900;letter-spacing:-.01em}.streak{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;background:var(--mint);color:var(--mint-ink);font-size:13px;font-weight:800;transform:rotate(1.5deg)}.streak-dot{width:8px;height:8px;border-radius:50%;background:currentColor}.theme{height:40px;padding:0 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);display:flex;align-items:center;gap:7px;cursor:pointer;font-size:13px;font-weight:700}
main{width:100%;max-width:1000px;margin:auto;padding:30px 20px 40px;position:relative}.view{animation:rise .3s ease both}.top-row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}.page-title{font-size:38px;font-weight:900;line-height:1.1;margin:0;letter-spacing:-.025em}.subtle{color:var(--ink-2);font-size:14px}.progress-line{height:10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin-bottom:32px}.progress-line span{display:block;height:100%;border-radius:inherit;background:var(--accent);transition:width .4s ease}
.hero{border-radius:30px;padding:32px;background:var(--hero-bg);color:var(--hero-ink);display:grid;gap:20px;margin-bottom:40px;box-shadow:var(--shadow-lift);transform:rotate(-.45deg)}.eyebrow{justify-self:start;font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:7px 13px;border-radius:999px;background:var(--mint);color:var(--mint-ink);transform:rotate(1.2deg)}.hero h2{font-size:31px;font-weight:900;line-height:1.18;letter-spacing:-.02em;margin:0}.hero p{font-size:15.5px;line-height:1.6;max-width:58ch;color:var(--hero-sub);margin:0}.row-actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:none;cursor:pointer;padding:14px 24px;border-radius:18px;font-weight:800;transition:.18s}.btn:hover{transform:translateY(-2px) rotate(-.7deg)}.btn.primary{background:var(--hero-ink);color:var(--hero-bg)}.btn.secondary{background:transparent;color:var(--hero-ink);border:1.5px solid var(--hero-sub)}.btn.accent{background:var(--accent);color:var(--on-accent)}.btn.soft{background:var(--surface-2);border:1px solid var(--line);color:var(--ink)}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}.label{font-size:12.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}.path{display:grid;gap:14px}.lesson-card{width:100%;text-align:left;cursor:pointer;display:grid;grid-template-columns:54px 1fr auto;gap:18px;align-items:center;padding:20px;border-radius:26px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:.2s}.lesson-card:hover{transform:translateY(-3px) rotate(-.35deg);box-shadow:var(--shadow-lift)}.lesson-num{width:54px;height:54px;border-radius:19px;display:grid;place-items:center;font-size:17px;font-weight:900;transform:rotate(-3deg);background:var(--surface-2);color:var(--ink-3)}.lesson-card.done .lesson-num{background:var(--mint);color:var(--mint-ink)}.lesson-card.partial .lesson-num{background:var(--accent-soft);color:var(--accent-ink)}.lesson-copy{display:grid;gap:7px;min-width:0}.lesson-title{font-size:17.5px;font-weight:850;letter-spacing:-.01em}.lesson-sub{font-size:13.5px;color:var(--ink-2);line-height:1.5}.mini-progress{display:flex;align-items:center;gap:10px;margin-top:3px}.mini-bar{flex:1;max-width:170px;height:7px;border-radius:999px;background:var(--surface-2);overflow:hidden}.mini-bar span{display:block;height:100%;border-radius:inherit;background:var(--accent)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--ink-3)}.state{font-size:13px;font-weight:800;white-space:nowrap}.state.done{color:var(--mint-ink)}.state.partial{color:var(--accent-ink)}.state.start{color:var(--ink-3)}
.back{border:none;background:transparent;color:var(--ink-2);cursor:pointer;font-weight:700;padding:0;margin-bottom:20px}.lesson-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:26px}.lesson-head h1{font-size:36px;margin:4px 0 8px;letter-spacing:-.02em}.lesson-head p{margin:0;color:var(--ink-2);line-height:1.6}.phrase-stack{display:grid;gap:18px}.phrase-card{padding:24px;border-radius:28px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;gap:16px}.phrase-top{display:flex;align-items:flex-start;gap:14px}.phrase-index{width:38px;height:38px;border-radius:14px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:900;transform:rotate(-3deg);flex:none}.phrase-card h3{font-size:21px;margin:0;line-height:1.35}.save{margin-left:auto;width:40px;height:40px;border-radius:15px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:18px}.save.on{background:var(--mint);border-color:var(--mint-line);color:var(--mint-ink)}.meaning{font-size:14.5px;line-height:1.65;color:var(--ink-2)}.example{padding:15px 17px;border-radius:18px;background:var(--accent-soft);color:var(--accent-ink);font-size:14.5px;line-height:1.65}.phrase-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.info{padding:14px 15px;border-radius:18px;background:var(--surface-2);border:1px solid var(--line)}.info b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}.info span{font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.practice-area{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}.panel{padding:22px;border-radius:26px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}.panel h3{margin:0 0 14px;font-size:18px}.dialogue{display:grid;gap:11px}.dialogue-line{display:grid;grid-template-columns:82px 1fr;gap:10px}.speaker{font-size:12px;font-weight:900;color:var(--accent-ink)}.speech{font-size:14px;line-height:1.6;color:var(--ink-2)}.exercise{margin:0;padding-left:20px}.exercise li{margin:8px 0;color:var(--ink-2);line-height:1.6}.finish{margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 20px;border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.search{width:100%;padding:16px 20px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:15.5px;box-shadow:var(--shadow);margin-bottom:14px;outline:none}.search:focus{border-color:var(--accent)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.chip{cursor:pointer;padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:700;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.phrasebook-list{display:grid;gap:12px}.book-item{padding:20px;border-radius:26px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;gap:9px}.book-phrase{font-size:18px;font-weight:800;line-height:1.45}.book-meta{font-size:13.5px;line-height:1.6;color:var(--ink-2)}.tag{justify-self:start;font-size:10.5px;letter-spacing:.05em;padding:5px 11px;border-radius:999px;background:var(--surface-2);color:var(--ink-3)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:30px}.stat{padding:22px;border-radius:26px;box-shadow:var(--shadow);display:grid;gap:6px}.stat:nth-child(1){background:var(--accent);color:var(--on-accent)}.stat:nth-child(2){background:var(--mint);color:var(--mint-ink)}.stat:nth-child(3){background:var(--surface);color:var(--ink)}.stat strong{font-size:34px;line-height:1}.stat span{font-size:13.5px;font-weight:700}.mastery{display:grid;gap:12px}.mastery-row{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:18px 20px;border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}.mastery-row .title{font-weight:800;margin-bottom:9px}
.quiz-card{max-width:720px;margin:0 auto;padding:28px;border-radius:30px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-lift)}.quiz-card h2{font-size:28px;margin:0 0 8px}.quiz-card p{color:var(--ink-2);line-height:1.65}.quiz-phrase{font-size:25px;font-weight:900;margin:24px 0;padding:22px;border-radius:24px;background:var(--accent-soft);color:var(--accent-ink)}.quiz-actions{display:flex;gap:10px;flex-wrap:wrap}.reveal{margin-top:20px;padding:20px;border-radius:22px;background:var(--mint);color:var(--mint-ink);line-height:1.65}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line)}.nav-in{max-width:520px;margin:auto;padding:9px 12px 14px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.tab{cursor:pointer;border:none;padding:9px 4px;border-radius:16px;display:grid;gap:6px;justify-items:center;font-size:11.5px;font-weight:800;background:transparent;color:var(--ink-3)}.tab.on{background:var(--accent-soft);color:var(--accent-ink)}.tab-dot{width:22px;height:22px;border-radius:7px;background:var(--line)}.tab.on .tab-dot{background:var(--accent)}
.empty{padding:38px;text-align:center;border-radius:26px;border:1.5px dashed var(--line);color:var(--ink-2)}
@media(max-width:720px){.streak{display:none}.page-title{font-size:32px}.hero{padding:25px}.lesson-card{grid-template-columns:46px 1fr}.lesson-num{width:46px;height:46px}.state{display:none}.phrase-grid,.practice-area,.stats{grid-template-columns:1fr}.lesson-head{display:block}.dialogue-line{grid-template-columns:70px 1fr}.brand-name{font-size:17px}}
</style>
</head>
<body>
<div class="app">
  <div class="blob one"></div><div class="blob two"></div>
  <header><div class="header-in"><div class="brand"><div class="logo">WE</div><div class="brand-name">Work English</div></div><div class="streak"><span class="streak-dot"></span><span id="streakText">Keep going</span></div><button class="theme" id="themeBtn">◐ <span id="themeLabel">Auto</span></button></div></header>
  <main id="main"><div class="empty">Loading your lessons…</div></main>
  <nav><div class="nav-in" id="nav"></div></nav>
</div>
<script>
const DATA_URL='./data/lessons.json';
const S={tab:'learn',active:null,query:'',filter:'All',practiceIdx:0,revealed:false};
let lessons=[];
const seen=new Set(JSON.parse(localStorage.getItem('workEnglishSeen')||'[]'));
const saved=new Set(JSON.parse(localStorage.getItem('workEnglishSaved')||'[]'));
const completed=new Set(JSON.parse(localStorage.getItem('workEnglishCompleted')||'[]'));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const key=(d,i)=>`${d}-${i}`;
function persist(){localStorage.setItem('workEnglishSeen',JSON.stringify([...seen]));localStorage.setItem('workEnglishSaved',JSON.stringify([...saved]));localStorage.setItem('workEnglishCompleted',JSON.stringify([...completed]));}
function allPhrases(){return lessons.flatMap((l,li)=>l.phrases.map((p,pi)=>({...p,li,pi,day:l.day,title:l.title})))}
function lessonDoneCount(l){return l.phrases.filter((_,i)=>seen.has(key(l.day,i))).length}
function firstUnfinished(){const x=lessons.findIndex(l=>lessonDoneCount(l)<l.phrases.length);return x<0?Math.max(0,lessons.length-1):x}
function openLesson(i){S.tab='lesson';S.active=i;lessons[i].phrases.forEach((_,pi)=>seen.add(key(lessons[i].day,pi)));localStorage.setItem('workEnglishActive',lessons[i].day);persist();render();scrollTo({top:0,behavior:'smooth'})}
function setTab(t){S.tab=t;if(t==='practice'&&S.active===null)S.practiceIdx=firstUnfinished();render();scrollTo({top:0,behavior:'smooth'})}
function toggleSave(day,pi){const k=key(day,pi);saved.has(k)?saved.delete(k):saved.add(k);persist();render()}
function toggleComplete(day){completed.has(day)?completed.delete(day):completed.add(day);persist();render()}
function learnedCount(){return seen.size}
function renderNav(){const tabs=[['learn','Learn','8px'],['practice','Practice','50%'],['book','Phrasebook','4px'],['progress','Progress','50%']];nav.innerHTML=tabs.map(([id,label,r])=>`<button class="tab ${S.tab===id||(id==='learn'&&S.tab==='lesson')?'on':''}" onclick="setTab('${id}')"><span class="tab-dot" style="border-radius:${r}"></span>${label}</button>`).join('')}
function renderLearn(){const ti=Math.max(0,lessons.length-1),t=lessons[ti],total=lessons.reduce((n,l)=>n+l.phrases.length,0),learned=learnedCount(),pct=total?Math.round(learned/total*100):0;return `<section class="view"><div class="top-row"><h1 class="page-title">Nice to see you back</h1><div class="subtle">${learned} of ${total} phrases learned</div></div><div class="progress-line"><span style="width:${pct}%"></span></div><section class="hero"><div class="eyebrow">Today · 5 min</div><div><h2>${esc(t.title)}</h2><p>${esc(t.theme)}</p></div><div class="row-actions"><button class="btn primary" onclick="openLesson(${ti})">${lessonDoneCount(t)?'Continue lesson':'Start lesson'}</button><button class="btn secondary" onclick="S.practiceIdx=${ti};setTab('practice')">Practice instead</button></div></section><div class="section-head"><div class="label">Your path</div><div class="subtle">Frontend track</div></div><div class="path">${lessons.map((l,i)=>{const done=lessonDoneCount(l),p=Math.round(done/l.phrases.length*100),full=completed.has(l.day)||done===l.phrases.length,cls=full?'done':done?'partial':'',st=full?'Done':done?'In progress':'Start';return `<button class="lesson-card ${cls}" onclick="openLesson(${i})"><span class="lesson-num">${String(l.day).padStart(2,'0')}</span><span class="lesson-copy"><span class="lesson-title">${esc(l.title)}</span><span class="lesson-sub">${esc(l.theme)}</span><span class="mini-progress"><span class="mini-bar"><span style="width:${p}%"></span></span><span class="mono">${done}/${l.phrases.length}</span></span></span><span class="state ${cls||'start'}">${st}</span></button>`}).join('')}</div></section>`}
function renderLesson(){const i=S.active??firstUnfinished(),l=lessons[i];return `<section class="view"><button class="back" onclick="setTab('learn')">← Back to path</button><div class="lesson-head"><div><div class="label">Lesson ${String(l.day).padStart(2,'0')}</div><h1>${esc(l.title)}</h1><p>${esc(l.theme)}</p></div><div class="eyebrow" style="transform:none">3 phrases</div></div><div class="phrase-stack">${l.phrases.map((p,pi)=>{const on=saved.has(key(l.day,pi));return `<article class="phrase-card"><div class="phrase-top"><div class="phrase-index">${pi+1}</div><div style="flex:1"><h3>“${esc(p.text)}”</h3></div><button class="save ${on?'on':''}" onclick="toggleSave(${l.day},${pi})" title="Save phrase">${on?'★':'☆'}</button></div><div class="meaning">${esc(p.meaning)}</div><div class="example">${esc(p.example)}</div><div class="phrase-grid"><div class="info"><b>When to use</b><span>${esc(p.use)}</span></div><div class="info"><b>When not to use</b><span>${esc(p.avoid)}</span></div><div class="info"><b>Common mistake</b><span>${esc(p.mistake)}</span></div><div class="info"><b>Pronunciation</b><span>${esc(p.pronunciation)}</span></div></div></article>`}).join('')}</div><div class="practice-area"><section class="panel"><h3>Real workplace dialogue</h3><div class="dialogue">${l.dialogue.map(x=>`<div class="dialogue-line"><div class="speaker">${esc(x[0])}</div><div class="speech">${esc(x[1])}</div></div>`).join('')}</div></section><section class="panel"><h3>Your exercise</h3><ol class="exercise">${l.exercise.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></section></div><div class="finish"><div><strong>${completed.has(l.day)?'Lesson complete':'Finished practicing?'}</strong><div class="subtle" style="margin-top:4px">Your progress is saved on this device.</div></div><button class="btn ${completed.has(l.day)?'soft':'accent'}" onclick="toggleComplete(${l.day})">${completed.has(l.day)?'✓ Completed':'Mark complete'}</button></div></section>`}
function renderBook(){const all=allPhrases(),query=S.query.toLowerCase().trim();let rows=all.filter(p=>!query||(p.text+' '+p.meaning+' '+p.title).toLowerCase().includes(query));if(S.filter==='Saved')rows=rows.filter(p=>saved.has(key(p.day,p.pi)));return `<section class="view"><h1 class="page-title" style="font-size:34px;margin-bottom:6px">Phrasebook</h1><p class="subtle" style="margin:0 0 22px">Every phrase you've met, searchable mid-standup.</p><input class="search" placeholder="Search ‘blocked’, ‘review’, ‘deadline’…" value="${esc(S.query)}" oninput="S.query=this.value;render()"><div class="filters"><button class="chip ${S.filter==='All'?'on':''}" onclick="S.filter='All';render()">All</button><button class="chip ${S.filter==='Saved'?'on':''}" onclick="S.filter='Saved';render()">Saved</button></div><div class="phrasebook-list">${rows.length?rows.map(p=>{const on=saved.has(key(p.day,p.pi));return `<article class="book-item"><div style="display:flex;gap:12px;align-items:flex-start"><div class="book-phrase" style="flex:1">“${esc(p.text)}”</div><button class="save ${on?'on':''}" onclick="toggleSave(${p.day},${p.pi})">${on?'★':'☆'}</button></div><div class="book-meta">${esc(p.meaning)}</div><div class="tag">LESSON ${String(p.day).padStart(2,'0')} · ${esc(p.title.toUpperCase())}</div></article>`}).join(''):'<div class="empty">Nothing here yet. Try a shorter word.</div>'}</div></section>`}
function renderProgress(){const learned=learnedCount(),done=completed.size;return `<section class="view"><h1 class="page-title" style="font-size:34px;margin-bottom:22px">Progress</h1><div class="stats"><div class="stat"><strong>${learned}</strong><span>Phrases learned</span></div><div class="stat"><strong>${saved.size}</strong><span>Saved to phrasebook</span></div><div class="stat"><strong>${done}</strong><span>Lessons completed</span></div></div><div class="section-head"><div class="label">Lesson mastery</div></div><div class="mastery">${lessons.map(l=>{const d=lessonDoneCount(l),p=Math.round(d/l.phrases.length*100);return `<div class="mastery-row"><div><div class="title">${esc(l.title)}</div><div class="mini-bar" style="max-width:none"><span style="width:${p}%"></span></div></div><div class="mono">${p}%</div></div>`}).join('')}</div></section>`}
function renderPractice(){const i=Math.min(S.practiceIdx,lessons.length-1),l=lessons[i],p=l.phrases[(new Date().getDate()+i)%l.phrases.length];return `<section class="view"><div class="quiz-card"><div class="label">Quick practice · Lesson ${String(l.day).padStart(2,'0')}</div><h2 style="margin-top:8px">Say it naturally</h2><p>Read the situation, answer out loud, then reveal the phrase.</p><div class="quiz-phrase">${S.revealed?'“'+esc(p.text)+'”':'Imagine a teammate asks about this situation: '+esc(p.use)}</div>${S.revealed?`<div class="reveal"><strong>Meaning:</strong> ${esc(p.meaning)}<br><br><strong>Example:</strong> ${esc(p.example)}</div>`:''}<div class="quiz-actions" style="margin-top:22px"><button class="btn accent" onclick="S.revealed=!S.revealed;render()">${S.revealed?'Hide answer':'Reveal answer'}</button><button class="btn soft" onclick="S.practiceIdx=(S.practiceIdx+1)%lessons.length;S.revealed=false;render()">Next lesson →</button></div></div></section>`}
function render(){renderNav();let html='';if(S.tab==='learn')html=renderLearn();else if(S.tab==='lesson')html=renderLesson();else if(S.tab==='book')html=renderBook();else if(S.tab==='progress')html=renderProgress();else html=renderPractice();main.innerHTML=html;streakText.textContent=completed.size?`${completed.size}-lesson progress`:'Start your streak'}
async function init(){try{lessons=await fetch(DATA_URL+'?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('data');return r.json()});const stored=Number(localStorage.getItem('workEnglishActive')||0);if(stored){const idx=lessons.findIndex(l=>l.day===stored);if(idx>=0)S.active=idx}render()}catch(e){main.innerHTML='<div class="empty">Could not load lesson data. Please refresh.</div>'}}
themeBtn.onclick=()=>{const cur=document.documentElement.dataset.theme;const next=cur==='dark'?'light':cur==='light'?'':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('workEnglishTheme',next);themeLabel.textContent=next==='dark'?'Dark':next==='light'?'Light':'Auto'};
const savedTheme=localStorage.getItem('workEnglishTheme')||'';document.documentElement.dataset.theme=savedTheme;themeLabel.textContent=savedTheme==='dark'?'Dark':savedTheme==='light'?'Light':'Auto';init();
</script>
</body>
</html>
