<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Work English — Daily Practice</title>
<meta name="description" content="Daily natural professional English for frontend work." />
<style>
:root{--bg:#f6f7fb;--panel:#fff;--text:#17191e;--muted:#737987;--line:#e7e9ef;--accent:#ff4f9a;--accent2:#7a5cff;--soft:#fff0f6;--good:#16a474;--shadow:0 18px 50px rgba(34,40,58,.08)}
[data-theme="dark"]{--bg:#111318;--panel:#191c23;--text:#f4f5f7;--muted:#a8aeba;--line:#2c3039;--soft:#2a1923;--shadow:0 18px 50px rgba(0,0,0,.28)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}.app{display:grid;grid-template-columns:330px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;overflow:auto;padding:22px;background:var(--panel);border-right:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;font-weight:900}.brand h1{font-size:17px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:3px 0 0}.progress{border:1px solid var(--line);background:var(--bg);border-radius:18px;padding:15px;margin-bottom:14px}.progress-row{display:flex;justify-content:space-between;align-items:center;gap:12px}.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:12px}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:.25s}.search{width:100%;padding:12px 13px;border-radius:13px;border:1px solid var(--line);background:var(--bg);color:var(--text);outline:none;margin:2px 0 13px}.search:focus{border-color:var(--accent)}.day-list{display:grid;gap:7px}.day-btn{width:100%;display:grid;grid-template-columns:36px 1fr auto;gap:9px;align-items:center;padding:10px;border-radius:13px;border:1px solid transparent;background:transparent;color:var(--text);text-align:left;cursor:pointer}.day-btn:hover{background:var(--bg);border-color:var(--line)}.day-btn.active{background:var(--soft);border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}.num{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:850;background:var(--panel)}.day-btn.active .num{background:var(--accent);border-color:var(--accent);color:#fff}.dt{font-size:13px;font-weight:800}.ds{font-size:11px;color:var(--muted);margin-top:2px}.tick{opacity:0;color:var(--good)}.done .tick{opacity:1}.main{padding:30px clamp(20px,5vw,68px) 70px;min-width:0}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:20px}.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:900}.icon{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:11px;padding:9px 11px;cursor:pointer}.hero{background:linear-gradient(135deg,var(--panel),color-mix(in srgb,var(--soft) 70%,var(--panel)));border:1px solid var(--line);border-radius:26px;padding:34px;box-shadow:var(--shadow)}.hero h2{font-size:clamp(32px,4vw,52px);letter-spacing:-.04em;line-height:1.05;margin:7px 0 10px}.hero p{max-width:780px;color:var(--muted);font-size:16px;line-height:1.65;margin:0}.review{margin-top:16px;padding:16px 18px;border-radius:16px;background:var(--panel);border:1px solid var(--line);color:var(--muted);line-height:1.6}.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);font-weight:900;margin:28px 0 11px}.phrases{display:grid;gap:14px}.phrase{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 8px 22px rgba(30,35,50,.04)}.phrase-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.phrase h3{margin:0;font-size:22px}.badge{font-size:11px;color:var(--accent);background:var(--soft);padding:6px 8px;border-radius:999px;font-weight:850;white-space:nowrap}.example{margin-top:12px;padding:13px 14px;border-left:3px solid var(--accent);background:var(--soft);border-radius:0 12px 12px 0;font-size:14px;line-height:1.55}.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:15px}.detail{padding:13px 14px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}.detail b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}.detail p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:18px}.card h3{margin:0 0 12px;font-size:17px}.dialogue{display:grid;gap:9px}.line{display:grid;grid-template-columns:86px 1fr;gap:9px}.speaker{font-size:12px;font-weight:850;color:var(--accent)}.bubble{font-size:14px;line-height:1.55;color:var(--muted)}ol{margin:0;padding-left:20px}li{color:var(--muted);font-size:14px;line-height:1.6;margin:6px 0}.complete{margin-top:16px;border:1px dashed color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:16px;padding:15px 17px;display:flex;justify-content:space-between;align-items:center;gap:14px}.complete button{border:0;background:var(--accent);color:#fff;padding:10px 14px;border-radius:11px;font-weight:850;cursor:pointer}.complete button.done{background:var(--good)}.loading,.error{padding:50px 20px;text-align:center;color:var(--muted)}.footer{margin-top:25px;text-align:center;color:var(--muted);font-size:12px}@media(max-width:920px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}.day-list{grid-template-columns:repeat(2,minmax(0,1fr))}.two,.details{grid-template-columns:1fr}}@media(max-width:580px){.main{padding:20px 13px 45px}.sidebar{padding:15px}.day-list{grid-template-columns:1fr}.hero{padding:23px 18px;border-radius:20px}.phrase h3{font-size:19px}.line{grid-template-columns:70px 1fr}}
</style>
</head>
<body>
<div class="app"><aside class="sidebar"><div class="brand"><div class="logo">WE</div><div><h1>Work English</h1><p>Natural English for frontend work</p></div></div><div class="progress"><div class="progress-row"><div><div style="font-size:11px;color:var(--muted)">Progress</div><strong id="progressText">0 / 0 days</strong></div><strong id="pct">0%</strong></div><div class="bar"><span id="bar"></span></div></div><input id="search" class="search" placeholder="Search days, phrases, topics…" /><div id="dayList" class="day-list"></div></aside><main class="main"><div class="top"><div><div class="kicker">Daily practice</div><div style="font-size:13px;color:var(--muted);margin-top:4px">Read → say it → use it → review it.</div></div><button id="theme" class="icon" title="Toggle theme">◐</button></div><div id="content"><div class="loading">Loading lessons…</div></div><div class="footer">Each person’s completion progress stays private in their own browser.</div></main></div>
<script>
const DATA_URL='./data/lessons.json';const completed=new Set(JSON.parse(localStorage.getItem('workEnglishCompleted')||'[]'));let days=[];let active=Number(localStorage.getItem('workEnglishActive')||0);let q='';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function load(){try{days=await fetch(DATA_URL,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('data');return r.json()});if(!active&&days.length)active=days.at(-1).day;if(!days.some(d=>d.day===active)&&days.length)active=days.at(-1).day;renderSidebar();render()}catch(e){content.innerHTML='<div class="error">Could not load lesson data. Please refresh in a moment.</div>'}}
function renderSidebar(){const items=days.filter(d=>(d.title+' '+d.theme+' '+d.phrases.map(p=>p.text).join(' ')).toLowerCase().includes(q.toLowerCase()));dayList.innerHTML=items.map(d=>`<button class="day-btn ${d.day===active?'active':''} ${completed.has(d.day)?'done':''}" onclick="selectDay(${d.day})"><span class="num">${String(d.day).padStart(2,'0')}</span><span><div class="dt">${esc(d.title)}</div><div class="ds">${esc(d.theme)}</div></span><span class="tick">✓</span></button>`).join('');updateProgress()}
function render(){const d=days.find(x=>x.day===active)||days.at(-1);if(!d){content.innerHTML='<div class="loading">Loading…</div>';return}content.innerHTML=`<section class="hero"><div class="kicker">Day ${String(d.day).padStart(2,'0')}</div><h2>${esc(d.title)}</h2><p>${esc(d.theme)}</p></section><div class="review"><strong style="color:var(--text)">Spaced review:</strong> ${esc(d.review)}</div><div class="section-title">Today’s 3 phrases</div><section class="phrases">${d.phrases.map((p,i)=>`<article class="phrase"><div class="phrase-top"><h3>${esc(p.text)}</h3><span class="badge">Phrase 0${i+1}</span></div><div class="example">${esc(p.example)}</div><div class="details"><div class="detail"><b>Meaning & tone</b><p>${esc(p.meaning)}</p></div><div class="detail"><b>When to use</b><p>${esc(p.use)}</p></div><div class="detail"><b>When not to use</b><p>${esc(p.avoid)}</p></div><div class="detail"><b>Common mistake</b><p>${esc(p.mistake)}</p></div><div class="detail" style="grid-column:1/-1"><b>Pronunciation</b><p>${esc(p.pronunciation)}</p></div></div></article>`).join('')}</section><div class="section-title">Put it into practice</div><section class="two"><article class="card"><h3>Realistic workplace dialogue</h3><div class="dialogue">${d.dialogue.map(x=>`<div class="line"><div class="speaker">${esc(x[0])}</div><div class="bubble">${esc(x[1])}</div></div>`).join('')}</div></article><article class="card"><h3>Your exercise</h3><ol>${d.exercise.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></article></section><div class="complete"><div><strong>${completed.has(d.day)?'Completed':'Ready to practice?'}</strong><div style="font-size:12px;color:var(--muted);margin-top:3px">Mark it complete after you write your own examples.</div></div><button class="${completed.has(d.day)?'done':''}" onclick="toggle(${d.day})">${completed.has(d.day)?'✓ Completed':'Mark complete'}</button></div>`}
function selectDay(n){active=n;localStorage.setItem('workEnglishActive',n);renderSidebar();render();scrollTo({top:0,behavior:'smooth'})}function toggle(n){completed.has(n)?completed.delete(n):completed.add(n);localStorage.setItem('workEnglishCompleted',JSON.stringify([...completed]));renderSidebar();render()}function updateProgress(){const n=completed.size,p=days.length?Math.round(n/days.length*100):0;progressText.textContent=`${n} / ${days.length} days`;pct.textContent=p+'%';bar.style.width=p+'%'}search.addEventListener('input',e=>{q=e.target.value;renderSidebar()});theme.addEventListener('click',()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'':'dark';localStorage.setItem('workEnglishTheme',document.documentElement.dataset.theme)});document.documentElement.dataset.theme=localStorage.getItem('workEnglishTheme')||'';load();
</script></body></html>
