<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Work English</title>
<meta name="description" content="Daily natural professional English for frontend work." />
<style>
:root{--bg:#fbfbf8;--paper:#fff;--text:#1d211c;--muted:#6f756c;--line:#e7e9e2;--soft:#f2f4ee;--accent:#2f6f4e;--accent-soft:#eaf3ed;--warm:#fff8e8;--danger:#8d4f4f}
[data-theme="dark"]{--bg:#151713;--paper:#1b1e19;--text:#f3f5ef;--muted:#aeb4aa;--line:#30342d;--soft:#232720;--accent:#8fc6a6;--accent-soft:#1d2a22;--warm:#2a261c;--danger:#e1aaaa}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{color:inherit}.shell{max-width:1180px;margin:0 auto;padding:24px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:26px}.brand{display:flex;align-items:center;gap:12px}.mark{width:38px;height:38px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:-.02em}.brand h1{font-size:17px;line-height:1;margin:0}.brand p{font-size:12px;color:var(--muted);margin:4px 0 0}.top-actions{display:flex;align-items:center;gap:8px}.ghost{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 11px;cursor:pointer}.layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:36px}.sidebar{position:sticky;top:20px;align-self:start}.progress{padding:14px 0 18px;border-bottom:1px solid var(--line);margin-bottom:16px}.progress-head{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:12px;color:var(--muted)}.progress strong{color:var(--text);font-size:13px}.progress-track{height:5px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:10px}.progress-track span{display:block;height:100%;width:0;background:var(--accent);transition:.2s}.search{width:100%;border:1px solid var(--line);background:var(--paper);color:var(--text);border-radius:10px;padding:10px 11px;outline:none;margin-bottom:12px}.search:focus{border-color:var(--accent)}.days{display:grid;gap:3px;max-height:calc(100vh - 220px);overflow:auto;padding-right:4px}.day{border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:10px;cursor:pointer;display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center}.day:hover{background:var(--soft)}.day.active{background:var(--accent-soft)}.day-num{font-size:11px;color:var(--muted);font-weight:700}.day-title{font-size:13px;line-height:1.25;font-weight:700}.check{font-size:12px;color:var(--accent);opacity:0}.day.done .check{opacity:1}.lesson{max-width:760px;margin:0 auto;padding-bottom:60px}.lesson-header{padding:12px 0 22px;border-bottom:1px solid var(--line)}.eyebrow{font-size:12px;color:var(--accent);font-weight:800;letter-spacing:.08em;text-transform:uppercase}.lesson-header h2{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:clamp(38px,6vw,62px);line-height:1.02;letter-spacing:-.035em;margin:10px 0 14px}.lesson-header p{font-size:17px;line-height:1.65;color:var(--muted);margin:0;max-width:680px}.review{margin:24px 0;padding:16px 18px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;font-size:14px;line-height:1.65}.section{margin-top:38px}.section-kicker{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}.phrase{padding:26px 0;border-top:1px solid var(--line)}.phrase:first-child{border-top:0;padding-top:0}.phrase-index{font-size:11px;color:var(--muted);margin-bottom:8px}.phrase h3{font-family:Georgia,"Times New Roman",serif;font-size:31px;font-weight:500;letter-spacing:-.02em;margin:0 0 16px}.meaning{font-size:16px;line-height:1.7;margin:0 0 18px}.example{background:var(--warm);border-radius:12px;padding:15px 16px;line-height:1.6;font-size:14px;margin:16px 0}.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.meta h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}.meta p{font-size:13.5px;line-height:1.6;margin:0;color:var(--text)}.pronunciation{margin-top:16px;font-size:13px;color:var(--muted);line-height:1.6}.pronunciation strong{color:var(--text)}.practice-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.box{border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:18px}.box h3{font-size:15px;margin:0 0 14px}.dialogue{display:grid;gap:10px}.line{display:grid;grid-template-columns:72px 1fr;gap:10px;font-size:14px;line-height:1.55}.speaker{font-weight:800;color:var(--accent)}.bubble{color:var(--muted)}ol{margin:0;padding-left:20px}li{font-size:14px;line-height:1.6;color:var(--muted);margin:7px 0}.complete{margin-top:28px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;align-items:center}.complete-copy strong{display:block;font-size:14px}.complete-copy span{display:block;font-size:12px;color:var(--muted);margin-top:4px}.primary{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.primary.done{background:var(--soft);color:var(--accent);border:1px solid var(--line)}.empty,.error{padding:60px 0;text-align:center;color:var(--muted)}@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:relative;top:auto}.days{display:flex;overflow:auto;max-height:none;padding-bottom:4px}.day{min-width:150px;grid-template-columns:28px 1fr auto}.lesson{max-width:none}.practice-grid{grid-template-columns:1fr}}@media(max-width:620px){.shell{padding:16px}.brand p{display:none}.layout{gap:20px}.meta-grid{grid-template-columns:1fr;gap:14px}.lesson-header h2{font-size:42px}.phrase h3{font-size:27px}.topbar{margin-bottom:14px}.sidebar{overflow:hidden}.days{margin-right:-16px;padding-right:16px}.line{grid-template-columns:60px 1fr}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><div class="mark">WE</div><div><h1>Work English</h1><p>English you can actually use at work</p></div></div>
    <div class="top-actions"><button class="ghost" id="theme" aria-label="Toggle theme">◐</button></div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="progress">
        <div class="progress-head"><strong id="progressText">0 / 0 lessons</strong><span id="pct">0%</span></div>
        <div class="progress-track"><span id="bar"></span></div>
      </div>
      <input id="search" class="search" placeholder="Search lessons…" />
      <div id="dayList" class="days"></div>
    </aside>

    <main id="content" class="lesson"><div class="empty">Loading lessons…</div></main>
  </div>
</div>
<script>
const DATA_URL='./data/lessons.json';
const completed=new Set(JSON.parse(localStorage.getItem('workEnglishCompleted')||'[]'));
let days=[];let active=Number(localStorage.getItem('workEnglishActive')||0);let q='';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function load(){try{days=await fetch(DATA_URL,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('data');return r.json()});if(!active&&days.length)active=days.at(-1).day;if(!days.some(d=>d.day===active)&&days.length)active=days.at(-1).day;renderSidebar();render()}catch(e){content.innerHTML='<div class="error">Could not load lesson data. Please refresh.</div>'}}
function renderSidebar(){const items=days.filter(d=>(d.title+' '+d.theme+' '+d.phrases.map(p=>p.text).join(' ')).toLowerCase().includes(q.toLowerCase()));dayList.innerHTML=items.map(d=>`<button class="day ${d.day===active?'active':''} ${completed.has(d.day)?'done':''}" onclick="selectDay(${d.day})"><span class="day-num">${String(d.day).padStart(2,'0')}</span><span class="day-title">${esc(d.title)}</span><span class="check">✓</span></button>`).join('');updateProgress()}
function render(){const d=days.find(x=>x.day===active)||days.at(-1);if(!d){content.innerHTML='<div class="empty">No lessons yet.</div>';return}content.innerHTML=`
<section class="lesson-header"><div class="eyebrow">Day ${String(d.day).padStart(2,'0')}</div><h2>${esc(d.title)}</h2><p>${esc(d.theme)}</p></section>
<div class="review"><strong>Quick review.</strong> ${esc(d.review)}</div>
<section class="section"><div class="section-kicker">Today’s 3 phrases</div>${d.phrases.map((p,i)=>`<article class="phrase"><div class="phrase-index">0${i+1}</div><h3>${esc(p.text)}</h3><p class="meaning">${esc(p.meaning)}</p><div class="example">${esc(p.example)}</div><div class="meta-grid"><div class="meta"><h4>Use it when</h4><p>${esc(p.use)}</p></div><div class="meta"><h4>Avoid it when</h4><p>${esc(p.avoid)}</p></div><div class="meta"><h4>Common mistake</h4><p>${esc(p.mistake)}</p></div><div class="meta"><h4>Sound natural</h4><p>${esc(p.pronunciation)}</p></div></div></article>`).join('')}</section>
<section class="section"><div class="section-kicker">Practice</div><div class="practice-grid"><div class="box"><h3>Real workplace dialogue</h3><div class="dialogue">${d.dialogue.map(x=>`<div class="line"><div class="speaker">${esc(x[0])}</div><div class="bubble">${esc(x[1])}</div></div>`).join('')}</div></div><div class="box"><h3>Your turn</h3><ol>${d.exercise.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div></div></section>
<div class="complete"><div class="complete-copy"><strong>${completed.has(d.day)?'Lesson complete':'Done for today?'}</strong><span>Your progress is saved in this browser.</span></div><button class="primary ${completed.has(d.day)?'done':''}" onclick="toggle(${d.day})">${completed.has(d.day)?'✓ Completed':'Mark complete'}</button></div>`}
function selectDay(n){active=n;localStorage.setItem('workEnglishActive',n);renderSidebar();render();window.scrollTo({top:0,behavior:'smooth'})}
function toggle(n){completed.has(n)?completed.delete(n):completed.add(n);localStorage.setItem('workEnglishCompleted',JSON.stringify([...completed]));renderSidebar();render()}
function updateProgress(){const n=completed.size,p=days.length?Math.round(n/days.length*100):0;progressText.textContent=`${n} / ${days.length} lessons`;pct.textContent=p+'%';bar.style.width=p+'%'}
search.addEventListener('input',e=>{q=e.target.value;renderSidebar()});
theme.addEventListener('click',()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'':'dark';localStorage.setItem('workEnglishTheme',document.documentElement.dataset.theme)});
document.documentElement.dataset.theme=localStorage.getItem('workEnglishTheme')||'';
load();
</script>
</body>
</html>
