name: Apply friendly font
on:
  push:
    paths:
      - '.github/workflows/apply-friendly-font.yml'
permissions:
  contents: write
jobs:
  update-font:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update font
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('<style>', '<style>\n@import url(\'https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap\');', 1)
          s = s.replace('font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif', 'font-family:"Nunito",ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif', 1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Use friendlier Nunito font"
          git push
